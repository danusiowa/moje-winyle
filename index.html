<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moje winyle</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --card: #ffffff;
      --text: #201f1d;
      --muted: #77736d;
      --accent: #201f1d;
      --border: #ded9d1;
      --danger: #a43a3a;
      --shadow: 0 12px 32px rgba(25, 22, 18, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
    }
    header {
      max-width: 1200px; margin: 0 auto; padding: 46px 24px 22px;
      display: flex; justify-content: space-between; gap: 20px; align-items: end;
    }
    .eyebrow { text-transform: uppercase; letter-spacing: .16em; font-size: 12px; color: var(--muted); font-weight: 700; }
    h1 { margin: 5px 0 0; font-size: clamp(32px, 5vw, 54px); letter-spacing: -.04em; }
    .count { color: var(--muted); margin-top: 8px; }
    button, input { font: inherit; }
    .primary {
      border: 0; border-radius: 999px; padding: 13px 20px; background: var(--accent); color: white;
      cursor: pointer; font-weight: 700; box-shadow: var(--shadow);
    }
    .toolbar { max-width: 1200px; margin: 0 auto; padding: 10px 24px 28px; }
    .search {
      width: 100%; border: 1px solid var(--border); background: rgba(255,255,255,.72);
      border-radius: 16px; padding: 15px 18px; outline: none;
    }
    .search:focus { border-color: #99938b; background: white; }
    main {
      max-width: 1200px; margin: 0 auto; padding: 0 24px 60px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 26px;
    }
    .card { min-width: 0; }
    .cover-wrap {
      position: relative; aspect-ratio: 1; background: #e8e3db; border-radius: 8px; overflow: hidden;
      box-shadow: var(--shadow);
    }
    .cover { width: 100%; height: 100%; object-fit: cover; display: block; }
    .placeholder {
      width: 100%; height: 100%; display: grid; place-items: center; text-align: center; color: var(--muted);
      padding: 20px; background: linear-gradient(135deg, #e8e2d9, #d8d1c7);
    }
    .actions {
      position: absolute; right: 9px; top: 9px; display: flex; gap: 6px; opacity: 0; transition: .18s;
    }
    .cover-wrap:hover .actions { opacity: 1; }
    .icon-btn {
      border: 0; border-radius: 999px; width: 35px; height: 35px; cursor: pointer;
      background: rgba(255,255,255,.92); box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }
    .meta { padding: 12px 3px 0; }
    .title { font-size: 17px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .artist { color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty {
      grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 80px 20px;
      border: 1px dashed var(--border); border-radius: 20px;
    }
    dialog {
      border: 0; border-radius: 22px; padding: 0; width: min(520px, calc(100vw - 32px));
      box-shadow: 0 24px 80px rgba(0,0,0,.25); background: white;
    }
    dialog::backdrop { background: rgba(20,18,15,.52); backdrop-filter: blur(3px); }
    .modal { padding: 26px; }
    .modal h2 { margin: 0 0 22px; font-size: 27px; }
    label { display: block; font-weight: 700; margin: 15px 0 7px; }
    .field {
      width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 12px 13px; outline: none;
    }
    .field:focus { border-color: #8c867e; }
    .hint { color: var(--muted); font-size: 13px; margin-top: 7px; line-height: 1.4; }
    .preview {
      width: 130px; aspect-ratio: 1; object-fit: cover; border-radius: 8px; margin-top: 12px; display: none;
      border: 1px solid var(--border);
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
    .secondary { border: 1px solid var(--border); border-radius: 999px; padding: 11px 17px; background: white; cursor: pointer; font-weight: 700; }
    .danger { color: var(--danger); }
    @media (max-width: 600px) {
      header { align-items: flex-start; flex-direction: column; padding-top: 28px; }
      header .primary { width: 100%; }
      main { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .actions { opacity: 1; }
      .title { font-size: 15px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="eyebrow">Prywatna kolekcja</div>
      <h1>Moje winyle</h1>
      <div class="count" id="count"></div>
    </div>
    <button class="primary" id="addBtn">＋ Dodaj album</button>
  </header>

  <div class="toolbar">
    <input id="search" class="search" type="search" placeholder="🔎  Szukaj po tytule lub artyście..." />
  </div>

  <main id="grid"></main>

  <dialog id="albumDialog">
    <form class="modal" id="albumForm">
      <h2 id="dialogTitle">Dodaj album</h2>
      <input type="hidden" id="editId" />

      <label for="artist">Artysta</label>
      <input class="field" id="artist" required maxlength="120" placeholder="np. Lady Gaga" />

      <label for="title">Tytuł</label>
      <input class="field" id="title" required maxlength="160" placeholder="np. MAYHEM" />

      <label for="image">Okładka</label>
      <input class="field" id="image" type="file" accept="image/*" />
      <div class="hint">Zdjęcie zostanie zapisane razem z kolekcją w tej przeglądarce.</div>
      <img id="preview" class="preview" alt="Podgląd okładki" />

      <div class="modal-actions">
        <button type="button" class="secondary" id="cancelBtn">Anuluj</button>
        <button type="submit" class="primary">Zapisz</button>
      </div>
    </form>
  </dialog>

  <script>
    const STORAGE_KEY = "myVinylCollection_v1";
    let albums = loadAlbums();
    let pendingImage = "";

    const grid = document.getElementById("grid");
    const count = document.getElementById("count");
    const search = document.getElementById("search");
    const dialog = document.getElementById("albumDialog");
    const form = document.getElementById("albumForm");
    const artistInput = document.getElementById("artist");
    const titleInput = document.getElementById("title");
    const imageInput = document.getElementById("image");
    const preview = document.getElementById("preview");
    const editId = document.getElementById("editId");
    const dialogTitle = document.getElementById("dialogTitle");

    function loadAlbums() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function saveAlbums() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(albums));
      } catch (e) {
        alert("Nie udało się zapisać kolekcji. Pamięć przeglądarki może być pełna — spróbuj użyć mniejszych zdjęć.");
      }
    }

    function esc(value) {
      return String(value).replace(/[&<>"']/g, c => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
      }[c]));
    }

    function render() {
      const q = search.value.trim().toLocaleLowerCase("pl");
      const filtered = albums.filter(a =>
        a.artist.toLocaleLowerCase("pl").includes(q) ||
        a.title.toLocaleLowerCase("pl").includes(q)
      ).sort((a,b) => a.artist.localeCompare(b.artist, "pl"));

      count.textContent = albums.length === 1 ? "1 album" : `${albums.length} albumów`;

      if (!filtered.length) {
        grid.innerHTML = `<div class="empty">${albums.length ? "Brak albumów pasujących do wyszukiwania." : "Twoja kolekcja jest jeszcze pusta.<br><br>Kliknij „Dodaj album”, aby dodać pierwszy winyl."}</div>`;
        return;
      }

      grid.innerHTML = filtered.map(a => `
        <article class="card">
          <div class="cover-wrap">
            ${a.image ? `<img class="cover" src="${a.image}" alt="Okładka ${esc(a.title)}">` :
              `<div class="placeholder">♪<br>Brak okładki</div>`}
            <div class="actions">
              <button class="icon-btn" title="Edytuj" onclick="editAlbum('${a.id}')">✎</button>
              <button class="icon-btn danger" title="Usuń" onclick="deleteAlbum('${a.id}')">×</button>
            </div>
          </div>
          <div class="meta">
            <div class="title" title="${esc(a.title)}">${esc(a.title)}</div>
            <div class="artist" title="${esc(a.artist)}">${esc(a.artist)}</div>
          </div>
        </article>
      `).join("");
    }

    function openAdd() {
      form.reset();
      editId.value = "";
      pendingImage = "";
      preview.src = "";
      preview.style.display = "none";
      dialogTitle.textContent = "Dodaj album";
      dialog.showModal();
      setTimeout(() => artistInput.focus(), 50);
    }

    window.editAlbum = function(id) {
      const a = albums.find(x => x.id === id);
      if (!a) return;
      form.reset();
      editId.value = id;
      artistInput.value = a.artist;
      titleInput.value = a.title;
      pendingImage = a.image || "";
      if (pendingImage) {
        preview.src = pendingImage;
        preview.style.display = "block";
      } else {
        preview.style.display = "none";
      }
      dialogTitle.textContent = "Edytuj album";
      dialog.showModal();
    }

    window.deleteAlbum = function(id) {
      const a = albums.find(x => x.id === id);
      if (!a || !confirm(`Usunąć „${a.title}” — ${a.artist}?`)) return;
      albums = albums.filter(x => x.id !== id);
      saveAlbums();
      render();
    }

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        pendingImage = e.target.result;
        preview.src = pendingImage;
        preview.style.display = "block";
      };
      reader.readAsDataURL(file);
    });

    form.addEventListener("submit", e => {
      e.preventDefault();
      const artist = artistInput.value.trim();
      const title = titleInput.value.trim();
      if (!artist || !title) return;

      if (editId.value) {
        const a = albums.find(x => x.id === editId.value);
        if (a) Object.assign(a, { artist, title, image: pendingImage });
      } else {
        albums.push({
          id: (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString()),
          artist, title, image: pendingImage
        });
      }
      saveAlbums();
      dialog.close();
      render();
    });

    document.getElementById("addBtn").addEventListener("click", openAdd);
    document.getElementById("cancelBtn").addEventListener("click", () => dialog.close());
    search.addEventListener("input", render);
    dialog.addEventListener("click", e => {
      const r = dialog.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dialog.close();
    });

    render();
  </script>
</body>
</html>
