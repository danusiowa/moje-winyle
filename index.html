<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E9">
<title>VinyLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap">
<style>
:root{
  --bg:#F6F1E9; --surface:#FFFFFF; --line:#E8E0D3; --sunk:#EEE7DC;
  --ink:#2E2F33; --muted:#6E6A64; --vinyl:#1B1B1D; --label:#F3E7CF;
  --ochre:#D9A032; --ochre-ink:#8F6413; --ochre-soft:#FBF1DC;
  --pink:#E07A8C;  --pink-ink:#A8394F;  --pink-soft:#FBE8EC;
  --teal:#2E9C95;  --teal-ink:#1D6E69;  --teal-soft:#E3F3F1;
  --danger:#B4233C; --danger-soft:#FBE3E6;
  --display:'DM Sans', 'Helvetica Neue', Arial, sans-serif;
  --sans:'DM Sans', 'Helvetica Neue', Arial, sans-serif;
  --nav-h:68px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
img{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- typografia ---------- */
.display{font-family:var(--display);font-weight:800;letter-spacing:-.035em;line-height:1.02;margin:0}
.sub{margin:0;color:var(--muted);font-size:15px}

/* ---------- przyciski i pola ---------- */
.btn{min-height:52px;padding:0 24px;border:0;border-radius:26px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;box-shadow:3px 3px 0 var(--ochre);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ochre)}
.btn[disabled]{opacity:.55;cursor:default}
.btn-ghost{min-height:50px;padding:0 20px;border:1.5px solid var(--ink);border-radius:25px;background:transparent;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-danger{min-height:50px;padding:0 20px;border:0;border-radius:25px;background:var(--danger);color:#fff;font-weight:700}
.link{background:none;border:0;padding:8px 0;color:var(--muted);font-weight:500;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:14px;font-weight:700}
.input{width:100%;min-height:50px;padding:0 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}
.input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.input::placeholder{color:#9A958D}
.hint{font-size:13px;color:var(--muted)}
/* Skanowanie tylko na telefonie/tablecie: na komputerze (mysz, brak dotyku) chowamy kafel i separator. */
@media (hover:hover) and (pointer:fine){#scanBlock{display:none!important}}
.more{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.more summary{cursor:pointer;padding:14px 16px;font-size:14px;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .15s}
.more[open] summary::after{transform:rotate(-135deg)}
.more summary .hint{font-weight:400}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px}
.more-grid .wide{grid-column:1/-1}
@media (max-width:360px){.more-grid{grid-template-columns:1fr}}
.form-error{font-size:14px;color:var(--danger);min-height:20px}
.icon{width:22px;height:22px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- ekrany autoryzacji ---------- */
.auth{min-height:100svh;display:grid;place-items:center;padding:40px 24px calc(28px + env(safe-area-inset-bottom))}
.auth-card{width:min(400px,100%);display:flex;flex-direction:column;gap:30px}
.auth-brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.auth-brand .logo{width:112px;height:112px}
.auth-brand h1{font-size:40px;margin-top:4px}
.auth-brand .lead{margin:0;font-weight:500}
.auth-brand .sub{max-width:280px}
.auth-form{display:flex;flex-direction:column;gap:14px}
.auth-form .btn{margin-top:6px}
.auth-foot{text-align:center;display:flex;flex-direction:column;gap:2px}
.auth-foot .hint{font-size:13px}

/* ---------- układ aplikacji ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(246,241,233,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar-in{max-width:1440px;margin:0 auto;padding:0 48px;min-height:92px;display:flex;align-items:center;gap:48px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand .logo{width:56px;height:56px}
.brand span{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.04em}
.tabs{display:flex;gap:32px;align-self:stretch}
.tab{background:none;border:0;border-bottom:4px solid transparent;padding:0 4px;font-weight:500;color:var(--muted);font-size:19px}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[data-view="owned"][aria-current="page"]{border-color:var(--ochre)}
.tab[data-view="wanted"][aria-current="page"]{border-color:var(--pink)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
.top-actions .btn{min-height:52px;padding:0 26px;font-size:17px}
.logout{background:none;border:0;min-height:52px;padding:0 10px;display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500;font-size:17px}
.main{max-width:1440px;margin:0 auto;padding:48px 48px 72px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;margin-bottom:40px}
.head h2{font-size:60px;display:flex;align-items:center;gap:14px}
.head h2 .icon{width:40px;height:40px;color:var(--pink)}
.head .sub{margin-top:14px;font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.count{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:99px;background:var(--ochre-soft);color:var(--ink);font-weight:800;font-size:18px}
.count.wanted{background:var(--pink-soft)}
.search{position:relative;width:420px;max-width:100%}
.search .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.search .input{padding-left:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:40px 28px}
.card{display:flex;flex-direction:column;gap:8px;min-width:0}
.card-hit{display:flex;flex-direction:column;gap:8px;padding:0;border:0;background:none;text-align:left;min-width:0;border-radius:12px}
.cover{position:relative;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sunk)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.card-hit:hover .cover img{filter:brightness(.96)}
.meta{display:flex;flex-direction:column;gap:1px;min-width:0}
.meta b,.meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{font-size:17px}
.meta span{font-size:15px;color:var(--muted)}
.have{align-self:flex-start;min-height:40px;padding:0 16px;border:1.5px solid var(--ink);border-radius:20px;background:transparent;font-weight:700;font-size:14px}
.have:hover{background:var(--pink-soft)}
.bottomnav{display:none}

/* okładki zastępcze */
.ph{position:absolute;inset:0}
.ph i{position:absolute;display:block}
.ph-0{background:var(--teal)} .ph-0 i{width:70%;aspect-ratio:1;border-radius:50%;background:var(--vinyl);left:15%;top:15%} .ph-0 i+i{width:22%;background:var(--label);left:39%;top:39%}
.ph-1{background:var(--ochre)} .ph-1 i{left:14%;right:14%;height:9%;border-radius:99px;background:var(--pink);bottom:44%} .ph-1 i+i{right:34%;bottom:29%} .ph-1 i+i+i{right:54%;bottom:14%;background:var(--vinyl)}
.ph-2{background:var(--pink)} .ph-2 i{width:90%;aspect-ratio:1;border-radius:50%;background:var(--vinyl);left:5%;top:50%} .ph-2 i+i{width:18%;background:var(--ochre);left:auto;right:14%;top:14%}
.ph-3{background:var(--vinyl)} .ph-3 i{bottom:14%;width:18%;border-radius:99px;background:var(--ochre);left:16%;height:72%} .ph-3 i+i{left:41%;height:52%;background:var(--pink)} .ph-3 i+i+i{left:66%;height:32%;background:var(--teal)}

/* puste stany */
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:56px 24px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.empty .badge{width:56px;height:56px;border-radius:28px;display:grid;place-items:center}
.empty .badge .icon{width:28px;height:28px}
.empty strong{font-family:var(--display);font-weight:800;font-size:22px;margin-top:6px}
.empty span{color:var(--muted);font-size:15px;max-width:320px}
.empty .btn{margin-top:10px;min-height:48px}
.b-ochre{background:var(--ochre-soft);color:var(--ochre-ink)} .b-pink{background:var(--pink-soft);color:var(--pink-ink)}
.b-teal{background:var(--teal-soft);color:var(--teal-ink)} .b-grey{background:var(--sunk);color:var(--muted)} .b-danger{background:var(--danger-soft);color:var(--danger)}

/* ---------- dialogi ---------- */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:22px;width:min(520px,calc(100vw - 32px));max-height:calc(100svh - 32px);box-shadow:0 24px 70px rgba(30,28,25,.25)}
dialog::backdrop{background:rgba(46,47,51,.45)}
.sheet{padding:26px;display:flex;flex-direction:column;gap:16px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.sheet-head h2{font-size:30px}
.close{width:44px;height:44px;flex-shrink:0;border:0;border-radius:22px;background:var(--sunk);display:grid;place-items:center}
.scan-tile{display:flex;align-items:center;gap:14px;padding:16px;border:0;border-radius:16px;background:var(--teal-soft);text-align:left;width:100%}
.scan-tile .ic{width:48px;height:48px;border-radius:14px;background:var(--teal);color:#fff;display:grid;place-items:center;flex-shrink:0}
.scan-tile .ic .icon{width:26px;height:26px}
.scan-tile b{display:block;font-size:16px}
.scan-tile span{font-size:14px;color:var(--muted)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.seg{display:flex;gap:4px;padding:4px;border-radius:13px;background:var(--sunk)}
.seg button{flex:1 1 0;min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(46,47,51,.15)}
.lbl-row{display:flex;align-items:center;gap:8px}
.tip{position:relative;display:inline-flex}
.tip-btn{position:relative;width:24px;height:24px;padding:0;border-radius:12px;border:1.5px solid var(--muted);background:none;color:var(--muted);font-size:13px;font-weight:800;line-height:1;display:grid;place-items:center}
.tip-btn::after{content:"";position:absolute;inset:-10px}
.tip-btn:hover,.tip.open .tip-btn{border-color:var(--ink);color:var(--ink)}
.tip-pop{position:absolute;left:-8px;bottom:calc(100% + 10px);width:min(300px,72vw);padding:12px 14px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px;line-height:1.45;font-weight:400;box-shadow:0 10px 30px rgba(30,28,25,.25);opacity:0;visibility:hidden;transition:opacity .15s ease;z-index:5;display:flex;flex-direction:column;gap:6px}
.tip-pop span:last-child{color:#C9C5BE}
@media (hover:hover){.tip:hover .tip-pop{opacity:1;visibility:visible}}
.tip:has(.tip-btn:focus-visible) .tip-pop,.tip.open .tip-pop{opacity:1;visibility:visible}
.hint.warn{color:var(--danger)}
.cover-preview{width:96px;border-radius:10px;aspect-ratio:1;object-fit:cover;border:1px solid var(--line)}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--ochre-soft)}
.notice .icon{color:var(--ochre-ink)}
.notice b{display:block}
.notice span{font-size:14px;color:var(--muted)}
.sheet-actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.sheet-actions .link{align-self:center}
.confirm{width:min(360px,calc(100vw - 32px))}
.confirm .sheet{gap:8px}
.confirm h2{font-size:24px}
.confirm .row{display:flex;gap:10px;margin-top:14px}
.confirm .row>*{flex:1 1 0}

/* ---------- skaner ---------- */
.scanner{position:fixed;inset:0;z-index:60;background:#232427;color:#fff;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.scanner-top{display:flex;align-items:center;justify-content:space-between;max-width:560px;width:100%;margin:0 auto}
.scanner-top b{font-size:16px}
.scanner .close{background:rgba(255,255,255,.12);color:#fff}
.scanner-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;max-width:560px;width:100%;margin:0 auto;overflow:auto;padding:12px 0}
.viewfinder{position:relative;width:min(320px,86vw);aspect-ratio:3/2;border-radius:18px;overflow:hidden;background:#111214}
.viewfinder video{width:100%;height:100%;object-fit:cover;display:block}
.viewfinder .c{position:absolute;width:34px;height:34px;border:0 solid var(--teal)}
.c.tl{left:0;top:0;border-top-width:4px;border-left-width:4px;border-top-left-radius:18px}
.c.tr{right:0;top:0;border-top-width:4px;border-right-width:4px;border-top-right-radius:18px}
.c.bl{left:0;bottom:0;border-bottom-width:4px;border-left-width:4px;border-bottom-left-radius:18px}
.c.br{right:0;bottom:0;border-bottom-width:4px;border-right-width:4px;border-bottom-right-radius:18px}
.viewfinder .beam{position:absolute;left:24px;right:24px;top:50%;height:2px;background:var(--pink);box-shadow:0 0 12px var(--pink);animation:beam 2.2s ease-in-out infinite}
@keyframes beam{0%,100%{transform:translateY(-38px)}50%{transform:translateY(38px)}}
.scan-msg b{display:block;font-size:17px}
.scan-msg span{font-size:14px;color:#C9C5BE}
.manual-code{display:flex;gap:8px;width:min(320px,86vw)}
.manual-code .input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff;letter-spacing:.06em}
.manual-code .input::placeholder{color:#9E9A93;letter-spacing:0}
.manual-code button{min-height:50px;padding:0 16px;border-radius:12px;border:0;background:var(--teal);color:#fff;font-weight:700}
.scanner .btn-ghost{color:#fff;border-color:rgba(255,255,255,.6);width:100%;max-width:560px;margin:0 auto}
.found{background:var(--bg);color:var(--ink)}
.found .scanner-top b{color:var(--ink)}
.found .close{background:var(--sunk);color:var(--ink)}
.found .scanner-body{justify-content:flex-start;text-align:left;align-items:stretch}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--teal-soft);color:var(--teal-ink);font-size:13px;font-weight:700}
.pill .icon{width:14px;height:14px}
.record{position:relative;height:230px;flex-shrink:0}
.record .disc{position:absolute;left:92px;top:12px;width:206px;height:206px;border-radius:50%;background:var(--vinyl);display:grid;place-items:center}
.record .disc::after{content:"";width:62px;height:62px;border-radius:50%;background:var(--label)}
.record .cover{position:absolute;left:0;top:0;width:230px}
.facts{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.facts small{display:block;font-size:13px;color:var(--muted)}
.facts b{font-size:17px}
.facts .src{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.facts .src a{color:var(--muted)}
.facts .src-links{display:flex;gap:12px;flex-wrap:wrap}
.facts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;padding-top:10px;border-top:1px solid var(--line)}
.facts-grid > div:last-child:nth-child(odd){grid-column:1/-1}
.facts-grid span{font-size:15px;font-weight:600}

/* ---------- loader ---------- */
.loader{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(246,241,233,.72);backdrop-filter:blur(3px)}
.loader-box{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:280px;padding:0 20px}
.loader-box p{margin:0;font-size:14px;color:var(--muted);opacity:0;transition:opacity .25s ease}
.loader.long .loader-box p{opacity:1}
.spin{width:56px;height:56px;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- toasty ---------- */
.toasts{position:fixed;right:24px;bottom:24px;z-index:100;display:flex;flex-direction:column;gap:10px;width:min(380px,calc(100vw - 32px));pointer-events:none}
.toast{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 26px rgba(46,47,51,.14);pointer-events:auto;animation:toastIn .22s ease}
.toast.out{opacity:0;transform:translateY(8px);transition:.2s ease}
.toast .badge{width:32px;height:32px;border-radius:16px;display:grid;place-items:center;flex-shrink:0}
.toast .badge .icon{width:18px;height:18px}
.toast b{display:block;font-size:15px}
.toast span{display:block;font-size:14px;color:var(--muted);line-height:1.35}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}}

/* ---------- mobile ---------- */
@media (max-width:760px){
  .topbar-in{padding:0 12px 0 20px;min-height:60px;gap:12px}
  .brand .logo{width:38px;height:38px}
  .brand span{font-size:23px}
  .tabs,.top-actions .btn,.logout span{display:none}
  .main{padding:18px 20px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom))}
  .head{flex-direction:column;align-items:stretch;gap:14px;margin-bottom:18px}
  .head h2{font-size:34px}
  .head h2 .icon{width:28px;height:28px}
  .head .sub{margin-top:8px;font-size:15px}
  .count{min-height:28px;padding:0 11px;font-size:15px}
  .meta b{font-size:15px}
  .meta span{font-size:13px}
  .search{width:100%}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(46,47,51,.07);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
  .bottomnav button{flex:1 1 0;min-height:56px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
  /* Ikona w „pigułce”: aktywna zakładka dostaje kolor swojej sekcji (ochra = kolekcja, róż = Po wypłacie). */
  .bottomnav button .icon{box-sizing:content-box;padding:5px 16px;border-radius:16px;transition:background .15s ease,color .15s ease}
  .bottomnav button[aria-current="page"]{color:var(--ink);font-weight:700}
  .bottomnav button[data-view="owned"][aria-current="page"] .icon{background:#F4E1B5;color:var(--ochre-ink)}
  .bottomnav button[data-view="wanted"][aria-current="page"] .icon{background:#F6D3DA;color:var(--pink-ink)}
  /* „Nowy nabytek” to akcja, nie zakładka: grafitowa pigułka jak główny przycisk. */
  .bottomnav #addBtnNav{color:var(--ink);font-weight:700}
  .bottomnav #addBtnNav .icon{background:var(--ink);color:#fff}
  .toasts{left:16px;right:16px;width:auto;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom))}
  .auth-only .toasts,.no-nav .toasts{bottom:calc(16px + env(safe-area-inset-bottom))}
  dialog{width:100%;max-width:none;max-height:92svh;margin:auto 0 0;border-radius:22px 22px 0 0}
  dialog.confirm{width:calc(100vw - 32px);margin:auto;border-radius:20px}
  .sheet{padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
  .sheet-head h2{font-size:26px}
}

const $ = (id) => document.getElementById(id);
const pickOne = (arr) => arr[Math.floor(Math.random() * arr.length)];
function plural(n, one, few, many) {
  if (n === 1) return one;
  const d = n % 10, dd = n % 100;
  return d >= 2 && d <= 4 && !(dd >= 12 && dd <= 14) ? few : many;
}
const norm = (s) => (s || "").toLocaleLowerCase("pl").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const safeUrl = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
}
function svgUse(id, cls = "icon") {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("class", cls); s.setAttribute("aria-hidden", "true");
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
  u.setAttribute("href", "#" + id); s.append(u); return s;
}
function hashIdx(s, mod) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h) % mod; }

/* ---------- loader: krótko sam winyl, dłużej + tekst ---------- */
let loaderCount = 0, loaderTimer;
function showLoader(text) {
  loaderCount++;
  $("loaderText").textContent = text || pickOne(COPY.loader.default);
  $("loader").classList.remove("long"); $("loader").hidden = false;
  clearTimeout(loaderTimer);
  loaderTimer = setTimeout(() => $("loader").classList.add("long"), CONFIG.LONG_OPERATION_MS);
}
function hideLoader() {
  loaderCount = Math.max(0, loaderCount - 1);
  if (!loaderCount) { clearTimeout(loaderTimer); $("loader").hidden = true; }
}
async function withLoader(text, fn) { showLoader(text); try { return await fn(); } finally { hideLoader(); } }

/* ---------- toasty ---------- */
const TOAST_STYLE = {
  success: ["b-teal", "i-check"], wanted: ["b-pink", "i-heart"], dup: ["b-ochre", "i-copy"],
  deleted: ["b-grey", "i-trash"], error: ["b-danger", "i-alert"], mail: ["b-teal", "i-mail"]
};
function toast(kind, pair) {
  const [title, text] = Array.isArray(pair[0]) ? pickOne(pair) : pair;
  const [bc, ic] = TOAST_STYLE[kind] || TOAST_STYLE.success;
  const t = el("div", { class: "toast", role: kind === "error" ? "alert" : "status" },
    el("span", { class: "badge " + bc }, svgUse(ic)),
    el("div", {}, el("b", { text: title }), el("span", { text: text })));
  $("toasts").append(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 250); }, kind === "error" ? 6500 : 4500);
}

let albums = [];
let view = "owned";
let loadFailed = false;
let entered = false;

async function enterApp() {
  if (entered) return;
  entered = true;
  pendingPasswordSetup = false;
  showScreen(true); setView(view, false);
  await loadAlbums();
}
async function loadAlbums() {
  const { data, error } = await withLoader(null, () =>
    db.from("albums").select("id, artist, title, image_url, source_url, barcode, status, created_at, year, country, label, catalog_number, format, master_url").order("created_at", { ascending: false }));

/* ---------- Własne kopie okładek (Supabase Storage, koszyk „covers”) ----------
   Zapisujemy kopię okładki u siebie, żeby nie znikała, gdy źródło usunie obrazek.
   Gdy kopiowanie się nie uda (brak funkcji, zły link, obrazek za duży), zostaje
   oryginalny link — zapis płyty nigdy przez to nie przepada. */
const COVER_PREFIX = CONFIG.SUPABASE_URL + "/storage/v1/object/public/covers/";
const isOwnCover = (u) => !!u && u.startsWith(COVER_PREFIX);
// coverServiceDown = true, gdy problem dotyczy samej usługi (brak funkcji/koszyka, sieć),
// a nie konkretnego obrazka (zły link, nie-obrazek, za duży, źródło nie oddało pliku).
let coverServiceDown = false;
async function ownCover(url) {
  if (!url || isOwnCover(url)) return url || null;
  try {
    const { data, error } = await db.functions.invoke("cover-copy", { body: { url } });
    if (error || !data?.url) throw error || new Error("no url");
    coverServiceDown = false;
    return await shrinkCover(data.url);
  } catch (err) {
    console.warn("cover-copy", err);
    coverServiceDown = ![400, 413, 415, 502, 546].includes(err?.context?.status);
    return url;
  }
}
// Zmniejszanie w przeglądarce: dłuższy bok najwyżej 800 px (ostro także na ekranach retina),
// JPEG ~85%. Typowa okładka po zmniejszeniu waży 60–150 KB. Mniejsze i lekkie obrazki zostają bez zmian.
// Oryginał z magazynu jest usuwany, gdy zapisze się mniejsza wersja; przy błędzie zostaje oryginał.
const COVER_MAX_PX = 800, COVER_MAX_BYTES = 400 * 1024;
async function shrinkCover(url) {
  if (!isOwnCover(url)) return url;
  try {
    const r = await fetch(url);
    if (!r.ok) return url;
    const blob = await r.blob();
    const bmp = await createImageBitmap(blob);
    const scale = Math.min(1, COVER_MAX_PX / Math.max(bmp.width, bmp.height));
    if (scale === 1 && blob.size <= COVER_MAX_BYTES) return url;
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);   // przezroczyste PNG → białe tło
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    const out = await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
    if (!out || out.size >= blob.size) return url;
    const folder = decodeURIComponent(url.slice(COVER_PREFIX.length)).split("/")[0];
    const path = `${folder}/${crypto.randomUUID()}.jpg`;
    const { error } = await db.storage.from("covers").upload(path, out, { contentType: "image/jpeg", cacheControl: "31536000" });
    if (error) return url;
    removeOwnCover(url);
    return COVER_PREFIX + path;
  } catch (err) { console.warn("shrinkCover", err); return url; }
}
function removeOwnCover(url) {
  if (!isOwnCover(url)) return;
  db.storage.from("covers").remove([decodeURIComponent(url.slice(COVER_PREFIX.length))]).catch(() => {});
}
// Jednorazowo w tle: przenosimy do magazynu okładki płyt dodanych wcześniej.
let backfillRunning = false;
async function backfillCovers() {
  if (backfillRunning) return;
  backfillRunning = true;
  let changed = false;
  for (const a of albums.filter(x => x.image_url && !isOwnCover(x.image_url))) {
    const url = await ownCover(a.image_url);
    if (url === a.image_url) { if (coverServiceDown) break; continue; }   // usługa niedostępna → spróbujemy przy następnym wejściu
    const { error } = await db.from("albums").update({ image_url: url }).eq("id", a.id);
    if (error) { removeOwnCover(url); continue; }
    a.image_url = url; changed = true;
  }
  backfillRunning = false;
  if (changed) render();
}

function setView(v, doRender = true) {
  view = v;
  document.querySelectorAll("[data-view]").forEach(b => {
    if (b.dataset.view === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  $("viewTitle").replaceChildren(COPY.views[v].title);
  if (v === "wanted") $("viewTitle").append(svgUse("i-heart"));
  $("search").placeholder = COPY.views[v].search;
  if (doRender) render();
}
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => { $("search").value = ""; setView(b.dataset.view); window.scrollTo({ top: 0 }); }));
document.querySelector("[data-view-link]").addEventListener("click", (e) => { e.preventDefault(); setView("owned"); });
$("search").addEventListener("input", () => render());

function coverNode(a) {
  const wrap = el("div", { class: "cover" });
  const url = safeUrl(a.image_url);
  const ph = () => el("div", { class: "ph ph-" + hashIdx(a.id || a.title, 4) }, el("i"), el("i"), el("i"));
  if (url) {
    const img = el("img", { src: url, alt: "", loading: "lazy", referrerpolicy: "no-referrer" });
    img.addEventListener("error", () => img.replaceWith(ph()), { once: true });
    wrap.append(img);
  } else wrap.append(ph());
  return wrap;
}
function emptyNode([title, text, cta], badgeCls, icon, onCta) {
  return el("div", { class: "empty" },
    el("span", { class: "badge " + badgeCls }, svgUse(icon)),
    el("strong", { text: title }), el("span", { text: text }),
    cta ? el("button", { class: "btn", type: "button", text: cta, onclick: onCta }) : null);
}
function render() {
  const grid = $("grid");
  const list = albums.filter(a => (a.status || "owned") === view);
  const q = norm($("search").value);
  const shown = q ? list.filter(a => norm(a.artist + " " + a.title).includes(q)) : list;
  if (loadFailed || !list.length) $("viewSub").replaceChildren();
  else {
    const [count, joke] = view === "owned" ? COPY.ownedSub(list.length) : COPY.wantedSub(list.length);
    $("viewSub").replaceChildren(el("span", { class: "count" + (view === "wanted" ? " wanted" : ""), text: count }), el("span", { text: joke }));
  }

  if (loadFailed) { grid.replaceChildren(emptyNode(COPY.empty.loadError, "b-danger", "i-alert")); return; }
  if (!list.length) {
    grid.replaceChildren(view === "owned"
      ? emptyNode(COPY.empty.owned, "b-ochre", "i-disc", () => openForm())
      : emptyNode(COPY.empty.wanted, "b-pink", "i-heart"));
    return;
  }
  if (!shown.length) {
    grid.replaceChildren(emptyNode(view === "owned" ? COPY.empty.noResult : COPY.empty.noResultWanted, "b-grey", "i-search"));
    return;
  }
  grid.replaceChildren(...shown.map(a => {
    const hit = el("button", { class: "card-hit", type: "button", "aria-label": `${a.title}, ${a.artist}. Edytuj`, onclick: () => openForm(a) },
      coverNode(a), el("span", { class: "meta" }, el("b", { text: a.title }), el("span", { text: a.artist })));
    const card = el("article", { class: "card" }, hit);
    if (view === "wanted") card.append(el("button", { class: "have", type: "button", text: COPY.have, "aria-label": `${COPY.have} ${a.title}`, onclick: () => moveToOwned(a) }));
    return card;
  }));
}

function findDuplicate({ artist, title, barcode }, exceptId) {
  const key = norm(artist) + "|" + norm(title);
  return albums.find(a => a.id !== exceptId && ((barcode && a.barcode && a.barcode === barcode) || norm(a.artist) + "|" + norm(a.title) === key));
}

async function moveToOwned(a) {
  const { error } = await withLoader(COPY.loader.save, () => db.from("albums").update({ status: "owned" }).eq("id", a.id));
  if (error) { toast("error", COPY.toast.saveError); return; }
  a.status = "owned"; render(); toast("success", COPY.toast.moved);
}

let editing = null, formStatus = "owned", dupConfirmed = false;

document.querySelectorAll("[data-status]").forEach(b => b.addEventListener("click", () => setFormStatus(b.dataset.status)));
function resetDup() { dupConfirmed = false; $("dupNotice").hidden = true; $("saveBtn").textContent = editing ? COPY.form.save : COPY.form.add; }
["fArtist", "fTitle"].forEach(id => $(id).addEventListener("input", resetDup));

$("imgTip").replaceChildren(...COPY.form.imgTip.map(t => el("span", { text: t })));

document.addEventListener("click", (e) => {

function openForm(a = null, prefill = {}) {
  editing = a;
  $("albumForm").reset(); $("formError").textContent = "";
  $("formTitle").textContent = a ? COPY.form.editTitle : COPY.form.addTitle;
  $("formSub").textContent = a ? COPY.form.editSub : COPY.form.addSub;
  $("scanTileTitle").textContent = COPY.form.scanTitle; $("scanTileSub").textContent = COPY.form.scanSub;
  $("imgHint").textContent = COPY.form.imgHint;
  $("scanBlock").hidden = !!a;
  $("deleteBtn").hidden = !a;
  const src = a || prefill;
  $("fArtist").value = src.artist || ""; $("fTitle").value = src.title || "";
  $("fImage").value = src.image_url || ""; $("fBarcode").value = src.barcode || ""; $("fSource").value = src.source_url || "";
  $("fMaster").value = src.master_url || "";
  $("fYear").value = src.year || ""; $("fCountry").value = countryName(src.country);
  $("fLabel").value = src.label || ""; $("fCatno").value = src.catalog_number || ""; $("fFormat").value = src.format || "";
  if (!$("countryList").childElementCount)
    $("countryList").append(...[...new Set(Object.values(COUNTRY_FROM_NAME))].map(countryName).sort((a, b) => a.localeCompare(b, "pl")).map(n => el("option", { value: n })));
  $("moreBlock").open = !!(src.year || src.country || src.label || src.catalog_number || src.format);
  setFormStatus(src.status || (a ? "owned" : view));
  updatePreview();
  if (!$("albumDialog").open) $("albumDialog").showModal();
  setTimeout(() => (src.artist ? $("fTitle") : $("fArtist")).focus(), 60);
}
$("albumDialog").addEventListener("click", (e) => { if (e.target === $("albumDialog")) $("albumDialog").close(); });
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close()));
$("addBtnTop").addEventListener("click", () => openForm());
$("addBtnNav").addEventListener("click", () => openForm());

$("albumForm").addEventListener("submit", async (e) => {
  e.preventDefault(); $("formError").textContent = "";
  const payload = {
    artist: $("fArtist").value.trim(), title: $("fTitle").value.trim(),
    image_url: $("fImage").value.trim() || null, status: formStatus,
    barcode: $("fBarcode").value || null, source_url: $("fSource").value || null, master_url: $("fMaster").value || null,
    // Te same reguły co dla danych ze skanu, więc ręcznie wpisane pola wyglądają tak samo.
    year: cleanYear($("fYear").value), country: toCountryCode($("fCountry").value),
    label: cleanName($("fLabel").value), catalog_number: cleanCatno($("fCatno").value),
    format: $("fFormat").value.replace(/\s+/g, " ").trim() || null
  };
  if (!payload.artist || !payload.title) { $("formError").textContent = COPY.form.missing; return; }
  if ($("fYear").value.trim() && !payload.year) { $("formError").textContent = COPY.form.badYear; return; }
  if (payload.image_url && !safeUrl(payload.image_url)) { $("formError").textContent = COPY.form.badUrl; return; }
  if (editing) {
    delete payload.barcode; delete payload.source_url; delete payload.master_url;
    const oldCover = editing.image_url, coverChanged = payload.image_url !== oldCover;
    const { error } = await withLoader(COPY.loader.save, async () => {
      if (coverChanged) payload.image_url = await ownCover(payload.image_url);
      return db.from("albums").update(payload).eq("id", editing.id);
    });
    if (error) { if (coverChanged) removeOwnCover(payload.image_url); toast("error", COPY.toast.saveError); return; }
    if (coverChanged) removeOwnCover(oldCover);
    Object.assign(editing, payload); $("albumDialog").close(); render(); toast("success", COPY.toast.updated);
    return;
  }
  await addAlbum(payload, { fromForm: true });
});

// Wspólne dodawanie (formularz i skaner). Zwraca true, gdy zapisano.
async function addAlbum(payload, { fromForm = false } = {}) {
  const dup = findDuplicate(payload);
  // Kupione z listy życzeń → przenosimy zamiast dublować.
  if (dup && dup.status === "wanted" && payload.status === "owned") {
    const { error } = await withLoader(COPY.loader.save, () => db.from("albums").update({ status: "owned" }).eq("id", dup.id));
    if (error) { toast("error", COPY.toast.saveError); return false; }
    dup.status = "owned"; closeAllAdd(); setView("owned"); toast("success", COPY.toast.movedFromWanted); return true;
  }
  if (dup && dup.status === payload.status && !dupConfirmed) {
    const [t, x] = payload.status === "owned" ? COPY.toast.duplicate : COPY.toast.duplicateWanted;
    if (fromForm) {
      $("dupTitle").textContent = t; $("dupText").textContent = x; $("dupNotice").hidden = false;
      $("saveBtn").textContent = COPY.form.addAnyway; dupConfirmed = true;
      return false;
    }
    toast("dup", [t, x]);
    return false;
  }
  const { data, error } = await withLoader(COPY.loader.save, async () => {
    payload = { ...payload, image_url: await ownCover(payload.image_url) };
    return db.from("albums").insert(payload).select().single();
  });
  if (error) { removeOwnCover(payload.image_url); toast("error", COPY.toast.saveError); return false; }
  albums.unshift(data); closeAllAdd(); setView(payload.status);
  toast(payload.status === "owned" ? "success" : "wanted", payload.status === "owned" ? COPY.toast.addedOwned : COPY.toast.addedWanted);
  return true;
}
function closeAllAdd() { if ($("albumDialog").open) $("albumDialog").close(); closeFound(); dupConfirmed = false; }

/* ---------- usuwanie ---------- */
function confirmDialog(title, text, yes, no) {
  return new Promise((resolve) => {
    $("confirmTitle").textContent = title; $("confirmText").textContent = text;
    $("confirmYes").textContent = yes; $("confirmNo").textContent = no;
    const d = $("confirmDialog");
    const done = (v) => { d.close(); resolve(v); };
    $("confirmYes").onclick = () => done(true); $("confirmNo").onclick = () => done(false);
    d.oncancel = () => resolve(false);
    d.showModal(); $("confirmNo").focus();
  });
}
$("deleteBtn").addEventListener("click", async () => {
  const a = editing; if (!a) return;
  const ok = await confirmDialog(COPY.confirmDelete.title, COPY.confirmDelete.text(a), COPY.confirmDelete.yes, COPY.confirmDelete.no);
  if (!ok) return;
  const { error } = await withLoader(COPY.loader.remove, () => db.from("albums").delete().eq("id", a.id));
  if (error) { toast("error", COPY.toast.deleteError); return; }
  removeOwnCover(a.image_url);
  albums = albums.filter(x => x.id !== a.id); $("albumDialog").close(); render(); toast("deleted", COPY.toast.deleted);
});

/* =====================================================================
   SKANER: aparat → EAN/UPC → Discogs (zapas: MusicBrainz) → podgląd → zatwierdzenie
   ===================================================================== */
let stream = null, scanLoop = null, zxingReader = null, scanning = false;

function scanMsg([a, b]) { $("scanMsg").textContent = a; $("scanMsg2").textContent = b; }
async function openScanner() {
  if ($("albumDialog").open) $("albumDialog").close();
  $("scanner").hidden = false; $("codeInput").value = "";
  document.body.style.overflow = "hidden";
  scanMsg(COPY.scan.starting);
  try { await startCamera(); scanMsg(COPY.scan.aim); }
  catch (err) {
    console.warn(err);
    scanMsg(err && err.message === "unsupported" ? COPY.scan.unsupported : COPY.scan.noCamera);
    $("viewfinder").hidden = true;
  }
}
function closeScanner() {
  stopCamera(); $("scanner").hidden = true; $("viewfinder").hidden = false;
  if ($("found").hidden) document.body.style.overflow = "";
}
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("unsupported");
  $("viewfinder").hidden = false; scanning = true;
  const video = $("video");
  if ("BarcodeDetector" in window) {
    const formats = (await BarcodeDetector.getSupportedFormats()).filter(f => ["ean_13", "ean_8", "upc_a", "upc_e"].includes(f));
    if (formats.length) {
      const detector = new BarcodeDetector({ formats });
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
      video.srcObject = stream; await video.play();
      const tick = async () => {
        if (!scanning) return;
        try {
          const codes = await detector.detect(video);
          if (codes.length) { onCode(codes[0].rawValue); return; }
        } catch (_) {}
        scanLoop = setTimeout(tick, 200);
      };
      tick(); return;
    }
  }
  // iPhone / Firefox: ZXing ładowany dopiero, gdy potrzebny
  await loadScript(CONFIG.ZXING_URL);
  const Z = window.ZXing;
  const hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
  zxingReader = new Z.BrowserMultiFormatReader(hints, 250);
  await zxingReader.decodeFromConstraints({ video: { facingMode: { ideal: "environment" } }, audio: false }, video, (result) => {
    if (result && scanning) onCode(result.getText());
  });
}
function stopCamera() {
  scanning = false; clearTimeout(scanLoop);
  if (zxingReader) { try { zxingReader.reset(); } catch (_) {} zxingReader = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  const v = $("video"); v.pause(); v.srcObject = null;
}
function loadScript(src) {
  return new Promise((res, rej) => {
    if ([...document.scripts].some(s => s.src === src)) return res();
    const s = el("script", { src }); s.onload = res; s.onerror = () => rej(new Error("unsupported")); document.head.append(s);
  });
}
function onCode(raw) {
  if (!scanning) return;          // ZXing potrafi zgłosić ten sam kod kilka razy
  const code = String(raw).replace(/\D/g, "");
  if (!code) return;
  if (navigator.vibrate) navigator.vibrate(60);
  stopCamera(); lookup(code);
}
$("codeForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const code = $("codeInput").value.replace(/\D/g, "");
  if (![8, 12, 13].includes(code.length)) { $("scanMsg").textContent = COPY.scan.badCode; $("scanMsg2").textContent = ""; return; }
  stopCamera(); lookup(code);
});
$("openScanBtn").addEventListener("click", openScanner);
document.querySelector("[data-scan-close]").addEventListener("click", () => { closeScanner(); openForm(); });
$("scanManualBtn").addEventListener("click", () => { closeScanner(); openForm(); });

async function lookup(code) {
  // Duplikat po kodzie — sprawdzamy od razu, bez pytania internetu.
  const own = albums.find(a => a.barcode && a.barcode === code);
  let result = null, failed = false;
  try { result = await withLoader(COPY.loader.lookup, () => searchBarcode(code)); }
  catch (err) { console.warn(err); failed = true; }
  closeScanner();
  showFound(result, code, failed, own);
}
// Kolejność: Discogs (przez funkcję w Supabase, token zostaje na serwerze) → MusicBrainz.
// Błąd jednego źródła nie przerywa szukania; „błąd” pokazujemy tylko, gdy padły oba.
// Każde źródło oddaje dane w tym samym surowym kształcie, a normalizeRelease()
// ujednolica je w jednym miejscu — wynik wygląda tak samo bez względu na źródło.
async function searchBarcode(code) {
  let rec = null, errors = 0;
  try { rec = await searchDiscogs(code); } catch (err) { console.warn(err); errors++; }
  if (rec && rec.image_url) return rec;
  let mb = null;
  try { mb = await searchMusicBrainz(code); } catch (err) { console.warn(err); errors++; }
  // Discogs bez okładki → bierzemy tylko okładkę z MusicBrainz (reszta mogłaby dotyczyć innego tłoczenia).
  if (rec) return { ...rec, image_url: mb?.image_url || null };
  if (mb) return mb;
  if (errors === 2) throw new Error("all sources failed");
  return null;
}

async function searchDiscogs(code) {
  const { data, error } = await db.functions.invoke("discogs-barcode", { body: { barcode: code } });
  if (error) throw error;
  if (!data?.found) return null;
  const f = (data.formats || []).map(String);
  const has = (re) => f.some(x => re.test(x));
  return normalizeRelease({
    artist: data.artist, title: data.title, barcode: code,
    year: data.year, country: data.country, label: data.label, catno: data.catno,
    medium: f[0] || null,
    count: Number(data.format_quantity) || 1,
    size: (f.find(x => /^\d{1,2}"$/.test(x)) || null),
    kind: has(/^LP$/) ? "LP" : has(/^EP$/) ? "EP" : has(/^(Single|Maxi-Single)$/) ? "Single" : has(/^Album$/) ? "Album" : null,
    tags: f,
    image_url: data.image_url, source_url: data.source_url, master_url: data.master_url
  });
}

async function searchMusicBrainz(code) {
  const variants = new Set([code]);
  if (code.length === 12) variants.add("0" + code);
  if (code.length === 13 && code.startsWith("0")) variants.add(code.slice(1));
  const q = [...variants].map(v => "barcode:" + v).join(" OR ");
  const r = await fetch(`https://musicbrainz.org/ws/2/release/?query=${encodeURIComponent(q)}&fmt=json&limit=10`, { headers: { Accept: "application/json" } });
  if (!r.ok) throw new Error("mb " + r.status);
  const { releases = [] } = await r.json();
  if (!releases.length) return null;
  const isVinyl = (rel) => (rel.media || []).some(m => /vinyl/i.test(m.format || ""));
  const rel = releases.find(isVinyl) || releases[0];
  const artist = (rel["artist-credit"] || []).map(c => (c.name || c.artist?.name || "") + (c.joinphrase || "")).join("").trim();
  const media = rel.media || [];
  const fmt = media[0]?.format || "";                       // np. 12" Vinyl
  const li = (rel["label-info"] || [])[0] || {};
  const rg = rel["release-group"] || {};
  return normalizeRelease({
    artist, title: rel.title, barcode: code,
    year: (rel.date || "").slice(0, 4), country: rel.country, label: li.label?.name, catno: li["catalog-number"],
    medium: fmt.replace(/^\d{1,2}"\s*/, "") || null,
    count: media.length || 1,
    size: (fmt.match(/^\d{1,2}"/) || [null])[0],
    kind: rg["primary-type"] || null,
    tags: rg["secondary-types"] || [],
    image_url: await findCover(rel),
    source_url: `https://musicbrainz.org/release/${rel.id}`,
    master_url: rg.id ? `https://musicbrainz.org/release-group/${rg.id}` : null
  });
}

/* ---------- Ujednolicanie danych wydania ---------- */
// Kraje zapisujemy jako kod ISO (MusicBrainz daje kod, Discogs nazwę po angielsku).
const COUNTRY_FROM_NAME = {
  "uk": "GB", "united kingdom": "GB", "uk & europe": "XE", "uk & ireland": "GB", "us": "US", "usa": "US", "usa & canada": "US",
  "europe": "XE", "worldwide": "XW", "germany": "DE", "france": "FR", "poland": "PL", "japan": "JP", "netherlands": "NL",
  "italy": "IT", "canada": "CA", "australia": "AU", "spain": "ES", "sweden": "SE", "norway": "NO", "denmark": "DK",
  "finland": "FI", "belgium": "BE", "austria": "AT", "switzerland": "CH", "ireland": "IE", "portugal": "PT", "greece": "GR",
  "russia": "RU", "ussr": "SU", "czech republic": "CZ", "czechia": "CZ", "czechoslovakia": "XC", "hungary": "HU",
  "yugoslavia": "YU", "german democratic republic (gdr)": "DD", "brazil": "BR", "argentina": "AR", "mexico": "MX",
  "new zealand": "NZ", "south africa": "ZA", "south korea": "KR", "korea": "KR", "taiwan": "TW", "israel": "IL",
  "turkey": "TR", "ukraine": "UA", "romania": "RO", "bulgaria": "BG", "croatia": "HR", "slovenia": "SI", "slovakia": "SK",
  "lithuania": "LT", "latvia": "LV", "estonia": "EE", "india": "IN", "china": "CN", "hong kong": "HK", "scandinavia": "XS"
};
const COUNTRY_SPECIAL = { XE: "Europa", XW: "Świat", SU: "ZSRR", XC: "Czechosłowacja", YU: "Jugosławia", DD: "NRD", XS: "Skandynawia" };
const regionNames = (() => { try { return new Intl.DisplayNames(["pl"], { type: "region" }); } catch { return null; } })();
function countryName(code) {
  if (!code) return "";
  if (COUNTRY_SPECIAL[code]) return COUNTRY_SPECIAL[code];
  if (/^[A-Z]{2}$/.test(code) && regionNames) { try { return regionNames.of(code) || code; } catch { /* nieznany kod */ } }
  return code;
}
// Polskie nazwy → kod, żeby ręcznie wpisany kraj („Wielka Brytania”) też trafił do bazy jako GB.
const COUNTRY_FROM_PL = Object.fromEntries([...new Set([...Object.values(COUNTRY_FROM_NAME), "PL", "GB", "US", "DE"])]
  .map(c => [norm(countryName(c)), c]));
function toCountryCode(v) {
  const s = String(v || "").trim();
  if (!s) return null;
  if (/^[A-Za-z]{2}$/.test(s)) return s.toUpperCase() === "UK" ? "GB" : s.toUpperCase();
  return COUNTRY_FROM_NAME[s.toLowerCase()] || COUNTRY_FROM_PL[norm(s)] || s;
}

// Format w jednej postaci, np. „2×LP 12", reedycja, 180 g”.
const MEDIUM_PL = { vinyl: "Winyl", cd: "CD", cassette: "Kaseta", "dvd": "DVD", "file": "Plik" };
const FORMAT_TAGS = [
  [/^reissue$/i, "reedycja"], [/^repress$/i, "dodruk"], [/^remaster(ed)?$/i, "remaster"],
  [/^limited edition$/i, "edycja limitowana"], [/^deluxe edition$/i, "edycja deluxe"], [/^numbered$/i, "numerowana"],
  [/^compilation$/i, "kompilacja"], [/^picture disc$/i, "picture disc"], [/^(\d{3}) ?(gram|g)$/i, (m) => m[1] + " g"],
  [/^mono$/i, "mono"], [/^live$/i, "koncertowa"], [/^soundtrack$/i, "ścieżka dźwiękowa"], [/^unofficial release$/i, "nieoficjalne"]
];
function formatString({ medium, count, size, kind, tags }) {
  const isVinyl = /vinyl/i.test(medium || "") || !!size;
  let core;
  if (isVinyl) {
    const k = /^(LP|Album)$/i.test(kind || "") ? "LP" : /^EP$/i.test(kind || "") ? "EP" : /^single$/i.test(kind || "") ? "Singel" : "Winyl";
    core = (count > 1 ? count + "×" : "") + k + (size ? " " + size : "");
  } else {
    const m = MEDIUM_PL[String(medium || "").toLowerCase()] || (medium || "").trim();
    core = m ? (count > 1 ? count + "×" : "") + m : "";
  }
  const extras = [];
  for (const t of tags || []) for (const [re, out] of FORMAT_TAGS) {
    const m = String(t).trim().match(re);
    if (m) { const v = typeof out === "function" ? out(m) : out; if (!extras.includes(v)) extras.push(v); }
  }
  return [core, ...extras].filter(Boolean).join(", ") || null;
}
function cleanName(s) {        // Discogs dopisuje numery do powtarzających się nazw: „Polydor (2)”, „Prince*”
  const v = String(s || "").replace(/\s*\(\d+\)$/, "").replace(/\*$/, "").replace(/\s+/g, " ").trim();
  return v && !/^not on label/i.test(v) ? v : null;
}
function cleanCatno(s) {
  const v = String(s || "").replace(/\s+/g, " ").trim();
  return v && !/^\[?none\]?$/i.test(v) ? v : null;
}
function cleanYear(y) {
  const n = parseInt(y, 10);
  return n >= 1900 && n <= new Date().getFullYear() + 1 ? n : null;
}
function normalizeRelease(raw) {
  return {
    artist: cleanName(raw.artist) || "Nieznany wykonawca",
    title: String(raw.title || "").trim() || "Bez tytułu",
    barcode: raw.barcode || null,
    year: cleanYear(raw.year),
    country: toCountryCode(raw.country),
    label: cleanName(raw.label),
    catalog_number: cleanCatno(raw.catno),
    format: formatString(raw),
    image_url: raw.image_url || null,
    source_url: raw.source_url || null,
    master_url: raw.master_url || null
  };
}
// Wiersze „Wydanie / Wytwórnia / Format” — tylko te, które mają dane.
function releaseFacts(r) {
  const L = COPY.scan.labels;
  const rows = [
    [L.edition, [r.year, countryName(r.country)].filter(Boolean).join(" · ")],
    [L.label, [r.label, r.catalog_number].filter(Boolean).join(" · ")],
    [L.format, r.format]
  ].filter(([, v]) => v);
  if (!rows.length) return [];
  return [el("div", { class: "facts-grid" }, ...rows.map(([k, v]) => el("div", {}, el("small", { text: k }), el("span", { text: v }))))];
}
function sourceLabel(url) {
  const name = /discogs\.com/.test(url || "") ? "Discogs" : "MusicBrainz";
  return `${COPY.scan.labels.source} ${name}`;
}
async function findCover(rel) {
  const tryCAA = async (path) => {
    try {
      const r = await fetch(`https://coverartarchive.org/${path}`);
      if (!r.ok) return null;
      const j = await r.json();
      const img = (j.images || []).find(i => i.front) || (j.images || [])[0];
      const u = img && (img.thumbnails?.["500"] || img.thumbnails?.large || img.image);
      return u ? u.replace(/^http:/, "https:") : null;
    } catch { return null; }
  };
  return (await tryCAA(`release/${rel.id}`)) || (rel["release-group"]?.id ? await tryCAA(`release-group/${rel["release-group"].id}`) : null);
}

function showFound(rec, code, failed, own) {
  const body = $("foundBody"); body.replaceChildren();
  $("found").hidden = false; document.body.style.overflow = "hidden";
  if (!rec) {
    const [t, x, cta] = failed ? COPY.scan.lookupError : COPY.scan.notFound;
    body.style.justifyContent = "center";
    body.append(emptyNode([t, x, cta], failed ? "b-danger" : "b-teal", failed ? "i-alert" : "i-scan",
      () => { closeFound(); openForm(null, { barcode: code }); }));
    return;
  }
  body.style.justifyContent = "";
  const dup = own || findDuplicate(rec);
  const pill = el("span", { class: "pill" }, svgUse("i-check"), COPY.scan.foundPill);
  const head = el("div", {}, pill,
    el("h2", { class: "display", style: "font-size:30px;margin-top:10px", id: "foundTitle", text: COPY.scan.foundTitle }),
    el("p", { class: "sub", text: COPY.scan.foundSub }));
  const record = el("div", { class: "record" }, el("div", { class: "disc" }), coverNode({ ...rec, id: code }));
  const facts = el("div", { class: "facts" },
    el("div", {}, el("small", { text: COPY.scan.labels.artist }), el("b", { text: rec.artist })),
    el("div", {}, el("small", { text: COPY.scan.labels.title }), el("b", { text: rec.title })),
    ...releaseFacts(rec),
    el("div", { class: "src" }, el("span", { text: `${COPY.scan.labels.code} ${code}` }),
      el("span", { class: "src-links" },
        rec.master_url ? el("a", { href: rec.master_url, target: "_blank", rel: "noopener", text: COPY.scan.labels.allEditions }) : null,
        el("a", { href: rec.source_url, target: "_blank", rel: "noopener", text: sourceLabel(rec.source_url) }))));
  body.append(head, record, facts);
  if (dup) {
    const [t, x] = dup.status === "wanted" ? ["Masz to w „Po wypłacie”.", "Dodanie do kolekcji po prostu ją tam przeniesie."] : COPY.toast.duplicate;
    body.append(el("div", { class: "notice" }, svgUse("i-copy"), el("div", {}, el("b", { text: t }), el("span", { text: x }))));
  }
  const actions = el("div", { class: "sheet-actions", style: "margin-top:auto" },
    el("button", { class: "btn", type: "button", text: COPY.scan.addOwned, onclick: () => { dupConfirmed = true; addAlbum({ ...rec, status: "owned" }); } }),
    el("button", { class: "btn-ghost", type: "button", text: COPY.scan.addWanted, onclick: () => { dupConfirmed = false; addAlbum({ ...rec, status: "wanted" }); } }),
    el("button", { class: "link", type: "button", text: COPY.scan.notThis, onclick: () => { closeFound(); openForm(null, rec); } }));
  body.append(actions);
}
function closeFound() { $("found").hidden = true; document.body.style.overflow = ""; }
document.querySelector("[data-found-close]").addEventListener("click", closeFound);
$("rescanBtn").addEventListener("click", () => { closeFound(); openScanner(); });

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!$("scanner").hidden) closeScanner();
  else if (!$("found").hidden) closeFound();
});

(async () => {
  authMode("login");
  const { data: { session } } = await db.auth.getSession();
  if (session && pendingPasswordSetup) { showScreen(false); authMode("password"); }
  else if (session) enterApp();
  else showScreen(false);
})();
